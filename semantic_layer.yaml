# Semantic layer: makes raw Penny Ice Cap CSV radar datasets legible to an LLM agent.
#
# Each entry describes a dataset variable the way you'd explain it to a colleague:
# what it is, what unit it's in, and what it's useful for. The agent reads
# this file (not the raw points) to decide which dataset/variable a tool call
# should operate on.

datasets:
  ice_thickness:
    csv_column: "THICK"
    label: "Ice Thickness"
    unit: "meters"
    description: >
      Ice thickness measurements obtained from MCoRDS airborne radar.
      Useful for determining the depth of the glacier, finding maximum ice
      thickness zones, and estimating total ice volume. Valid range: 0 to 900 meters.
    value_range: [0, 900]

  surface_elevation:
    csv_column: "SURFACE" # computed as ELEVATION - SURFACE range
    label: "Surface Elevation"
    unit: "meters above sea level"
    description: >
      Glacier surface elevation derived from GPS aircraft altitude minus radar range to the ice surface.
      Useful for elevation profiling and identifying glacier peaks and flow direction. Valid range: 0 to 2200 meters.
    value_range: [0, 2200]

  bedrock_elevation:
    csv_column: "BOTTOM" # computed as ELEVATION - BOTTOM range
    label: "Bedrock Elevation"
    unit: "meters above sea level"
    description: >
      Bedrock elevation beneath the glacier, derived from GPS altitude minus radar range to bedrock.
      Useful for subglacial topography analysis and determining the base structure of the ice cap. Valid range: -200 to 2200 meters.
    value_range: [-200, 2200]

region:
  name: "Penny Ice Cap (Baffin Island, Nunavut, Canada)"
  bbox: [-67.80, 66.48, -63.56, 67.83]  # [west, south, east, north] -- matches dataset coordinate extent
  crs: "EPSG:4326"
  note: >
    REAL OBSERVATIONS. Data derived from NASA Operation IceBridge MCoRDS L2
    Airborne Ice Thickness measurements taken on April 28, 2017 (flight line IRMCR2_20170428_03).
